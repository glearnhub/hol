<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handmaidens of the Lord</title>
    <meta name="description" content="Discover upcoming events, register online and check in with your personal QR code." />
    <meta name="theme-color" content="#600086" />
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main>
      <section class="hero">
        <div class="container hero-grid">
          <div>
            <h1>Handmaidens of the Lord</h1>
            <p>Discover upcoming events, register in a minute and check in quickly with your personal QR code.</p>
            <a class="btn btn-light" href="events.html">Explore Events</a>
          </div>
          <div class="hero-logo">
            <img src="img/logo.png" alt="Handmaidens of the Lord: Radiating Revival" width="1064" height="812" />
          </div>
        </div>
      </section>

      <section class="section" id="events">
        <div class="container">
          <div class="section-title">
            <h2>Upcoming events</h2>
            <a href="events.html">See all events →</a>
          </div>
          <div id="featured-events" class="event-grid" aria-live="polite">
            <p class="muted">Loading events…</p>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <noscript><p class="container">This site needs JavaScript to work. Please enable it in your browser.</p></noscript>
    <script type="module">
      import { initHome } from './js/public-events.js'
      initHome()
    </script>
  </body>
</html>
