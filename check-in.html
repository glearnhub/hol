<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Check-in · Handmaidens of the Lord</title>
    <meta name="description" content="Volunteer check-in for Handmaidens of the Lord events." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Handmaidens of the Lord" />
    <meta property="og:title" content="Check-in · Handmaidens of the Lord" />
    <meta property="og:description" content="Volunteer check-in for Handmaidens of the Lord events." />
    <meta property="og:image" content="https://hol-lake.vercel.app/img/og-image.png" />
    <meta property="og:image:secure_url" content="https://hol-lake.vercel.app/img/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Handmaidens of the Lord logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Check-in · Handmaidens of the Lord" />
    <meta name="twitter:description" content="Volunteer check-in for Handmaidens of the Lord events." />
    <meta name="twitter:image" content="https://hol-lake.vercel.app/img/og-image.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/check-in.css" />
  </head>
  <body class="checkin">
    <header class="ci-header">
      <img class="ci-logo" src="img/logo-emblem.png" alt="" width="56" height="56" />
      <div class="ci-brand">Handmaidens of the Lord · Check-in</div>
      <h1 id="event-name">Loading…</h1>
      <div id="event-meta"></div>
      <div id="counts" class="ci-counts"></div>
    </header>

    <main class="ci-main">
      <div id="status" aria-live="polite"></div>

      <div id="app" class="hidden">
        <div class="ci-tabs" role="tablist">
          <button id="tab-scan" class="active" role="tab" type="button" aria-selected="true">Scan QR code</button>
          <button id="tab-search" role="tab" type="button" aria-selected="false">Search</button>
        </div>

        <!-- Result of the last action: green, amber or red -->
        <div id="result" class="ci-result hidden" role="status" aria-live="assertive"></div>

        <section id="panel-scan">
          <div class="ci-card">
            <div id="reader"></div>
            <p id="camera-note" class="muted"></p>
            <div id="camera-help" class="notice notice-warning hidden" role="alert"></div>
            <div class="ci-actions">
              <button id="camera-toggle" class="btn btn-primary" type="button">Start camera</button>
              <label class="btn btn-outline ci-photo" for="photo-input">Scan from a photo</label>
              <input id="photo-input" class="visually-hidden" type="file" accept="image/*" capture="environment" />
            </div>
            <div id="file-reader" class="hidden" aria-hidden="true"></div>
          </div>

          <div class="ci-card">
            <h2>Camera not working?</h2>
            <form id="manual-form" novalidate>
              <label for="manual-code">Enter the code printed under the QR code (e.g. HOL-1A2B3C4D)</label>
              <div class="ci-row">
                <input id="manual-code" type="text" autocomplete="off" autocapitalize="characters" maxlength="200" placeholder="HOL-XXXXXXXX" />
                <button class="btn btn-secondary" type="submit">Check in</button>
              </div>
            </form>
          </div>
        </section>

        <section id="panel-search" class="hidden">
          <div class="ci-card">
            <label for="search">Search by participant name or phone number</label>
            <input id="search" type="search" autocomplete="off" placeholder="Search by participant name or phone number" />
            <p class="muted" style="margin:.5rem 0 0">Type at least 3 characters.</p>
          </div>
          <div id="matches"></div>
          <div id="confirm" class="ci-card hidden"></div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script type="module" src="js/check-in.js"></script>
  </body>
</html>
